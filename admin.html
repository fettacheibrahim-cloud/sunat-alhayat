<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - الإدارة</title>
  <link rel="stylesheet" href="style.css?v=10">
  <style>
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
    .stat{background:var(--sand);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
    .stat b{display:block;font-size:22px;color:var(--green)}
    .stat span{font-size:11px;color:var(--muted)}
    .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
    .tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--green);background:#fff;color:var(--green);font:inherit;cursor:pointer}
    .tabs button.on{background:var(--green);color:#fff}
    .m{padding:14px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 12px rgba(14,59,60,.05)}
    .m .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
    .m .acts button{padding:6px 14px;border-radius:999px;border:1px solid var(--green);background:var(--green);color:#fff;font:inherit;cursor:pointer}
    .m .acts button.no{background:#fff;color:var(--err);border-color:var(--err)}
    .m small{color:var(--muted);display:block;margin-top:4px}
  </style>
</head>
<body>
  <main style="max-width:640px;margin:0 auto;padding:20px 16px">
    <h1>لوحة الإدارة</h1>
    <p id="msg" style="display:none"></p>
    <div class="stats">
      <div class="stat"><b id="s_pending">-</b><span>قيد المراجعة</span></div>
      <div class="stat"><b id="s_approved">-</b><span>أعضاء</span></div>
      <div class="stat"><b id="s_msgs">-</b><span>رسائل</span></div>
      <div class="stat"><b id="s_reports">-</b><span>بلاغات</span></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-s="pending" class="on">قيد المراجعة</button>
      <button data-s="approved">مقبولون</button>
      <button data-s="suspended">موقوفون</button>
      <button data-s="reports">البلاغات</button>
      <button data-s="revenue">💰 الأرباح</button>
    </div>
    <div id="list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=11"></script>
  <script>
    const $ = id => document.getElementById(id);
    const mAr = { never_married:'أعزب/عزباء', divorced:'مطلّق/ة', widowed:'أرمل/ة' };
    const gAr = { male:'ذكر', female:'أنثى' };
    let cur = 'pending';

    function age(d) {
      if (!d) return '';
      const b = new Date(d), t = new Date();
      let a = t.getFullYear() - b.getFullYear();
      if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
      return a;
    }

    function btn(text, fn, no) {
      const b = document.createElement('button');
      b.textContent = text;
      if (no) b.className = 'no';
      b.onclick = fn;
      return b;
    }

    async function setStatus(id, status) {
      const { error } = await sb.from('profiles').update({ status }).eq('id', id);
      if (error) { alert('خطأ: ' + error.message); return false; }
      loadAll(); return true;
    }

    // أسعار الباقات بالدرهم (طابقها مع PLANS في premium.html)
    const PLAN_PRICES = { 30: 50, 90: 120, 365: 400 };

    async function setPremium(id, days, amount) {
      if (days === 0 && !confirm('إلغاء العضوية المميزة لهذا العضو؟')) return;
      if (days > 0) {
        const msg = amount > 0 ? 'تأكيد استلام ' + amount + ' درهماً وتفعيل ' + days + ' يوماً؟' : 'تفعيل ' + days + ' يوماً كهدية (بدون مبلغ)؟';
        if (!confirm(msg)) return;
      }
      const { error } = await sb.rpc('admin_set_premium', { target: id, days, amount: amount || 0 });
      if (error) { alert('خطأ: ' + error.message + '\nتأكد من تشغيل premium2.sql'); return; }
      loadAll();
    }

    async function closeReport(id) {
      const { error } = await sb.from('reports').update({ status: 'reviewed' }).eq('id', id);
      if (error) { alert('خطأ: ' + error.message); return; }
      loadAll();
    }

    async function loadMembers() {
      const list = $('list'); list.innerHTML = '';
      const { data, error } = await sb.from('profiles').select('*').eq('status', cur).order('created_at', { ascending: false });
      if (error) { list.textContent = 'خطأ: ' + error.message; return; }
      if (!data.length) { list.innerHTML = '<p style="color:#666">لا توجد حسابات في هذه القائمة</p>'; return; }
      const prem = {};
      if (cur === 'approved') {
        const mm = await sb.from('memberships').select('user_id,premium_until');
        (mm.data || []).forEach(x => { if (new Date(x.premium_until) > new Date()) prem[x.user_id] = x.premium_until; });
      }
      data.forEach(p => {
        const d = document.createElement('div'); d.className = 'm';
        const n = document.createElement('b');
        n.textContent = (p.first_name || 'بدون اسم') + ' — ' + (gAr[p.gender] || '') + '، ' + age(p.birth_date) + ' سنة';
        const s = document.createElement('small');
        s.textContent = [p.city, p.country, mAr[p.marital_status]].filter(Boolean).join(' · ');
        d.append(n, s);
        if (p.bio) { const b = document.createElement('small'); b.textContent = p.bio; d.appendChild(b); }
        const a = document.createElement('div'); a.className = 'acts';
        if (cur === 'pending') a.append(btn('قبول', () => setStatus(p.id, 'approved')), btn('رفض', () => setStatus(p.id, 'suspended'), true));
        if (cur === 'approved') {
          if (prem[p.id]) {
            const ps = document.createElement('small');
            ps.textContent = '⭐ مميز حتى ' + new Date(prem[p.id]).toLocaleDateString('en-GB');
            d.appendChild(ps);
          }
          a.append(
            btn('⭐ شهر (' + PLAN_PRICES[30] + ')', () => setPremium(p.id, 30, PLAN_PRICES[30])),
            btn('⭐ 3 أشهر (' + PLAN_PRICES[90] + ')', () => setPremium(p.id, 90, PLAN_PRICES[90])),
            btn('⭐ سنة (' + PLAN_PRICES[365] + ')', () => setPremium(p.id, 365, PLAN_PRICES[365])),
            btn('🎁 هدية 30 يوماً', () => setPremium(p.id, 30, 0))
          );
          if (prem[p.id]) a.append(btn('إلغاء المميز', () => setPremium(p.id, 0), true));
          a.append(btn('إيقاف', () => setStatus(p.id, 'suspended'), true));
        }
        if (cur === 'suspended') a.append(btn('إعادة تفعيل', () => setStatus(p.id, 'approved')));
        d.appendChild(a);
        list.appendChild(d);
      });
    }

    async function loadReports() {
      const list = $('list'); list.innerHTML = '';
      const { data, error } = await sb.from('reports').select('*').eq('status', 'open').order('created_at', { ascending: false });
      if (error) { list.textContent = 'خطأ: ' + error.message; return; }
      if (!data.length) { list.innerHTML = '<p style="color:#666">لا توجد بلاغات مفتوحة</p>'; return; }
      const ids = [...new Set(data.flatMap(r => [r.reporter_id, r.reported_id]))];
      const { data: ps } = await sb.from('profiles').select('id,first_name').in('id', ids);
      const names = {}; (ps || []).forEach(p => names[p.id] = p.first_name);

      data.forEach(r => {
        const d = document.createElement('div'); d.className = 'm';
        const n = document.createElement('b');
        n.textContent = '🚩 ' + (names[r.reported_id] || 'عضو') + ' ← بلاغ من ' + (names[r.reporter_id] || 'عضو');
        const s = document.createElement('small'); s.textContent = 'السبب: ' + r.reason;
        d.append(n, s);
        if (r.details) { const t = document.createElement('small'); t.textContent = 'التفاصيل: ' + r.details; d.appendChild(t); }
        const a = document.createElement('div'); a.className = 'acts';
        a.append(
          btn('إيقاف الحساب', async () => {
            if (!confirm('إيقاف حساب ' + (names[r.reported_id] || '') + '؟')) return;
            if (await setStatus(r.reported_id, 'suspended')) closeReport(r.id);
          }, true),
          btn('إغلاق البلاغ', () => closeReport(r.id))
        );
        d.appendChild(a);
        list.appendChild(d);
      });
    }

    async function loadStats() {
      const c = async f => (await f).count ?? 0;
      $('s_pending').textContent = await c(sb.from('profiles').select('*', { count: 'exact', head: true }).eq('status', 'pending'));
      $('s_approved').textContent = await c(sb.from('profiles').select('*', { count: 'exact', head: true }).eq('status', 'approved'));
      $('s_msgs').textContent = await c(sb.from('messages').select('*', { count: 'exact', head: true }));
      $('s_reports').textContent = await c(sb.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'open'));
    }

    async function loadRevenue() {
      const list = $('list'); list.innerHTML = 'جاري التحميل…';
      const [mm, pp] = await Promise.all([
        sb.from('memberships').select('user_id,premium_until'),
        sb.from('premium_payments').select('*').order('created_at', { ascending: false }).limit(500)
      ]);
      if (mm.error || pp.error) { list.textContent = 'خطأ: ' + (mm.error || pp.error).message + ' — شغّل premium2.sql'; return; }
      const now = Date.now(), wk = now + 7 * 864e5, mo = new Date(); mo.setDate(1); mo.setHours(0, 0, 0, 0);
      const active = mm.data.filter(x => new Date(x.premium_until) > now);
      const soon = active.filter(x => new Date(x.premium_until) <= wk).sort((a, b) => new Date(a.premium_until) - new Date(b.premium_until));
      const sum = f => pp.data.filter(f).reduce((t, x) => t + Number(x.amount), 0);
      const revMonth = sum(x => new Date(x.created_at) >= mo), revTotal = sum(() => true);

      const ids = [...new Set([...soon.map(x => x.user_id), ...pp.data.slice(0, 20).map(x => x.user_id)])];
      const names = {};
      if (ids.length) { const { data } = await sb.from('profiles').select('id,first_name').in('id', ids); (data || []).forEach(p => names[p.id] = p.first_name); }

      list.innerHTML = '';
      const st = document.createElement('div'); st.className = 'stats';
      [[active.length, 'مميزون الآن'], [soon.length, 'ينتهون خلال 7 أيام'], [revMonth, 'درهم هذا الشهر'], [revTotal, 'درهم إجمالاً']].forEach(([n, l]) => {
        const d = document.createElement('div'); d.className = 'stat';
        const b = document.createElement('b'); b.textContent = n; const s = document.createElement('span'); s.textContent = l;
        d.append(b, s); st.appendChild(d);
      });
      list.appendChild(st);

      function section(title, rows, empty) {
        const h = document.createElement('h3'); h.textContent = title; list.appendChild(h);
        if (!rows.length) { const p = document.createElement('p'); p.style.color = '#666'; p.textContent = empty; list.appendChild(p); return; }
        rows.forEach(r => { const d = document.createElement('div'); d.className = 'm'; const b = document.createElement('b'); b.textContent = r[0]; const s = document.createElement('small'); s.textContent = r[1]; d.append(b, s); list.appendChild(d); });
      }
      section('تنتهي عضويتهم قريباً (راسلهم للتجديد)', soon.map(x => [names[x.user_id] || 'عضو', 'تنتهي في ' + new Date(x.premium_until).toLocaleDateString('en-GB')]), 'لا أحد خلال الأيام السبعة القادمة');
      section('آخر العمليات', pp.data.slice(0, 20).map(x => [(names[x.user_id] || 'عضو') + ' — ' + Number(x.amount) + ' درهم', x.days + ' يوماً · ' + new Date(x.created_at).toLocaleDateString('en-GB')]), 'لا توجد عمليات بعد');
    }

    function loadList() { return cur === 'reports' ? loadReports() : cur === 'revenue' ? loadRevenue() : loadMembers(); }
    function loadAll() { loadStats(); loadList(); }

    $('tabs').onclick = e => {
      if (e.target.tagName !== 'BUTTON') return;
      cur = e.target.dataset.s;
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
      loadList();
    };

    (async () => {
      const s = await getSession();
      if (!s) { location.href = 'auth.html'; return; }
      const { data } = await sb.from('profiles').select('is_admin').eq('id', s.user.id).maybeSingle();
      if (!data || !data.is_admin) { document.querySelector('main').innerHTML = '<h1>غير مصرّح</h1><p>هذه الصفحة للإدارة فقط.</p>'; return; }
      loadAll();
    })();
  </script>
</body>
</html>
