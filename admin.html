<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - موقع سنة الحياة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fdfcf0;
      font-family: 'Cairo', sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }

    .nav-pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .nav-pills a {
      text-decoration: none;
      color: #004d40;
      border: 1px solid #004d40;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .nav-pills a:hover, .nav-pills a.active {
      background-color: #004d40;
      color: #fff;
    }

    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .admin-header {
      font-size: 1.4rem;
      color: #004d40;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .stat-card {
      background: #f9f9f6;
      border-right: 4px solid #004d40;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-title {
      font-weight: bold;
      color: #333;
    }

    .stat-value {
      background: #004d40;
      color: #fff;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل (الأزرار) -->
  <nav class="nav-pills">
    <a href="index.html">الرئيسية</a>
    <a href="browse.html">التصفح</a>
    <a href="interests.html">الاهتمامات</a>
    <a href="messages.html">المحادثات</a>
    <a href="profile.html">ملفي</a>
    <a href="admin.html" class="active">الإدارة</a>
  </nav>

  <!-- محتوى لوحة الإدارة -->
  <div class="admin-container">
    <div class="admin-header">لوحة التحكم والإدارة</div>
    <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.95rem;">مرحباً بك في لوحة الإدارة لمراجعة وإدارة محتوى المنصة.</p>

    <div class="stat-card">
      <span class="stat-title">الحسابات قيد المراجعة والتوثيق</span>
      <span class="stat-value">3 طلبات</span>
    </div>

    <div class="stat-card">
      <span class="stat-title">إجمالي الأعضاء النشطين</span>
      <span class="stat-value">128 عضواً</span>
    </div>

    <div class="stat-card">
      <span class="stat-title">الرسائل والمحادثات اليومية</span>
      <span class="stat-value">45 رسالة</span>
    </div>
  </div>

</body>
</html>
