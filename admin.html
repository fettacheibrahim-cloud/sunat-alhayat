<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - الإدارة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
    .stat{background:#f7f5ee;border:1px solid #e5dcc5;border-radius:14px;padding:12px;text-align:center}
    .stat b{display:block;font-size:24px;color:#0E3B3C}
    .stat span{font-size:12px;color:#666}
    .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
    .tabs button{padding:8px 16px;border-radius:999px;border:1px solid #0E3B3C;background:#fff;color:#0E3B3C;font:inherit;cursor:pointer}
    .tabs button.on{background:#0E3B3C;color:#fff}
    .m{padding:14px;margin:8px 0;background:#f7f5ee;border:1px solid #e5dcc5;border-radius:14px}
    .m .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
    .m .acts button{padding:6px 14px;border-radius:999px;border:1px solid #0E3B3C;background:#0E3B3C;color:#fff;font:inherit;cursor:pointer}
    .m .acts button.no{background:#fff;color:#9b1c1c;border-color:#9b1c1c}
    .m small{color:#666;display:block;margin-top:4px}
  </style>
</head>
<body>
  <main class="card" style="max-width:640px;margin:30px auto;padding:20px">
    <h1>لوحة الإدارة</h1>
    <p id="msg" style="display:none"></p>
    <div class="stats">
      <div class="stat"><b id="s_pending">-</b><span>قيد المراجعة</span></div>
      <div class="stat"><b id="s_approved">-</b><span>أعضاء مقبولون</span></div>
