<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - الدخول</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="card" style="max-width:420px;margin:40px auto;padding:24px">
    <h1 id="title">تسجيل الدخول</h1>
    <form id="form">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" required>
      <label>كلمة المرور</label>
      <input id="password" type="password" minlength="8" required>
      <p id="forgotRow" style="margin:8px 0 0;font-size:14px">
        <a href="#" id="forgot">نسيت كلمة المرور؟</a>
      </p>
      <div id="termsRow" style="display:none;align-items:flex-start;gap:8px;margin-top:14px;font-size:14px;line-height:1.7">
        <input id="terms" type="checkbox" style="width:auto;margin-top:6px">
        <label for="terms" style="margin:0;font-weight:500">أوافق على <a href="legal.html#terms" target="_blank">الشروط والأحكام</a> و<a href="legal.html#privacy" target="_blank">سياسة الخصوصية</a>، وأؤكد أن عمري 18 سنة فأكثر.</label>
      </div>
      <button id="btn" type="submit" class="btn" style="width:100%;margin-top:16px">دخول</button>
    </form>
    <p id="msg" style="display:none;margin-top:12px"></p>
    <p style="text-align:center;margin-top:16px">
      <a href="#" id="toggle">ليس لديك حساب؟ سجّل الآن</a>
    </p>
    <p style="text-align:center;font-size:13px;color:var(--muted)">
      <a href="legal.html#privacy">الخصوصية</a> · <a href="legal.html#terms">الشروط</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=9"></script>
  <script>
    let isLogin = true;
    const $ = id => document.getElementById(id);
    const base = location.origin + location.pathname.replace('auth.html', '');
    // مسجّل الدخول أصلاً؟ لا حاجة لصفحة الدخول
    getSession().then(s => { if (s) location.replace('browse.html'); });
    $('toggle').onclick = e => {
      e.preventDefault();
      isLogin = !isLogin;
      $('title').textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
      $('btn').textContent = isLogin ? 'دخول' : 'تسجيل';
      $('toggle').textContent = isLogin ? 'ليس لديك حساب؟ سجّل الآن' : 'لديك حساب؟ ادخل';
      $('forgotRow').style.display = isLogin ? 'block' : 'none';
      $('termsRow').style.display = isLogin ? 'none' : 'flex';
      $('msg').style.display = 'none';
    };

    $('forgot').onclick = async e => {
      e.preventDefault();
      const email = $('email').value.trim();
      if (!email) { showMsg('msg', 'اكتب بريدك الإلكتروني أولاً ثم اضغط «نسيت كلمة المرور».', 'error'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: base + 'reset.html' });
      if (error) { showMsg('msg', 'تعذّر الإرسال: ' + error.message, 'error'); return; }
      showMsg('msg', 'إن كان البريد مسجّلاً لدينا فقد أرسلنا إليه رابط تغيير كلمة المرور. (انظر في المزعج أيضاً)', 'ok');
    };

    $('form').onsubmit = async e => {
      e.preventDefault();
      const btn = $('btn'); btn.disabled = true;
      const email = $('email').value.trim();
      const password = $('password').value;
      try {
        if (isLogin) {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            if (/not confirmed/i.test(error.message)) throw new Error('لم يتم تأكيد بريدك بعد. افتح رسالة التأكيد في بريدك.');
            if (/invalid login/i.test(error.message)) throw new Error('البريد أو كلمة المرور غير صحيحة.');
            throw error;
          }
          location.href = 'profile.html';
        } else {
          if (!$('terms').checked) throw new Error('يجب الموافقة على الشروط وسياسة الخصوصية للتسجيل.');
          const { data, error } = await sb.auth.signUp({
            email, password,
            options: { emailRedirectTo: base + 'profile.html' }
          });
          if (error) throw error;
          if (data.session) { location.href = 'profile.html'; return; }
          showMsg('msg', 'تم إنشاء حسابك. أرسلنا رسالة تأكيد إلى بريدك، افتحها واضغط الرابط ثم ادخل. (انظر في المزعج إن لم تجدها)', 'ok');
          btn.disabled = false;
        }
      } catch (err) {
        showMsg('msg', err.message, 'error');
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
