    <form id="loginForm">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="أدخل بريدك الإلكتروني" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
      </div>

      <button type="submit" class="btn-login">دخول</button>
    </form>

    <script>
      // منع الخطأ وتحويل المستخدم مباشرة إلى صفحة الملف الشخصي عند الضغط على دخول
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // منع الإرسال التقليدي للخادم
        window.location.href = 'profile.html'; // الانتقال لصفحة الملف الشخصي
      });
    </script>
