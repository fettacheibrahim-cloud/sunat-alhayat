<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التصفح - موقع سنة الحياة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fdfcf0;
      font-family: 'Cairo', sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }

    .nav-pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .nav-pills a {
      text-decoration: none;
      color: #004d40;
      border: 1px solid #004d40;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .nav-pills a:hover, .nav-pills a.active {
      background-color: #004d40;
      color: #fff;
    }

    .browse-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .browse-header {
      font-size: 1.4rem;
      color: #004d40;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .browse-card {
      background: #f9f9f6;
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .browse-card h3 {
      color: #004d40;
      margin: 0 0 8px 0;
      font-size: 1.1rem;
    }

    .browse-card p {
      margin: 0 0 10px 0;
      color: #666;
      font-size: 0.9rem;
    }

    .browse-btn {
      display: inline-block;
      background-color: #004d40;
      color: #fff;
      padding: 6px 15px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .browse-btn:hover {
      background-color: #00695c;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل (الأزرار) -->
  <nav class="nav-pills">
    <a href="index.html">الرئيسية</a>
    <a href="browse.html" class="active">التصفح</a>
    <a href="interests.html">الاهتمامات</a>
    <a href="messages.html">المحادثات</a>
    <a href="profile.html">ملفي</a>
    <a href="admin.html">الإدارة</a>
  </nav>

  <!-- محتوى التصفح -->
  <div class="browse-container">
    <div class="browse-header">تصفح المنشورات والخدمات</div>

    <div class="browse-card">
      <h3>خدمات توثيق الحسابات</h3>
      <p>تعرف على الشروط والخطوات اللازمة لتوثيق ملفك الشخصي والحفاظ على أمان حسابك.</p>
      <a href="#" class="browse-btn">عرض التفاصيل</a>
    </div>

    <div class="browse-card">
      <h3>إرشادات الخصوصية وأمان الصور</h3>
      <p>دليل كامل حول كيفية التحكم في صلاحيات رؤية صورك ومعلوماتك الشخصية.</p>
      <a href="#" class="browse-btn">عرض التفاصيل</a>
    </div>
  </div>

</body>
</html>
