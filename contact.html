<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - اتصل بنا</title>
  <link rel="stylesheet" href="style.css?v=10">
  <style>
    .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,#0E3B3C,#14595A)}
    .bar a{color:#fff;text-decoration:none}
    .bar .brand{font:700 1.4rem 'Amiri',serif}
    .bar .brand span{color:#D8B565}
    .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  </style>
</head>
<body>
  <div class="bar"><a class="brand" href="index.html">سنة <span>الحياة</span></a><a href="index.html">الرئيسية</a></div>
  <main style="max-width:560px;margin:0 auto;padding:20px 16px 50px">
    <div class="card">
      <h1>اتصل بنا</h1>
      <p style="color:var(--muted);margin-top:0">للاستفسار أو الإبلاغ عن مشكلة أو تقديم اقتراح. نقرأ كل رسالة. وقبل الإرسال قد تجد جوابك في <a href="faq.html">الأسئلة الشائعة</a>.</p>

      <form id="form">
        <label for="name">الاسم</label>
        <input id="name" required minlength="2" maxlength="80" autocomplete="name">

        <label for="email">البريد الإلكتروني (لنتمكن من الرد عليك)</label>
        <input id="email" type="email" required maxlength="120" autocomplete="email">

        <label for="subject">الموضوع</label>
        <select id="subject">
          <option>استفسار عام</option>
          <option>مشكلة تقنية</option>
          <option>بلاغ عن عضو</option>
          <option>طلب تعديل بيانات (مثل الجنس)</option>
          <option>اقتراح</option>
          <option>أخرى</option>
        </select>

        <label for="text">رسالتك</label>
        <textarea id="text" rows="6" required minlength="10" maxlength="2000"></textarea>

        <div class="hp" aria-hidden="true"><label>الموقع<input id="website" tabindex="-1" autocomplete="off"></label></div>

        <button id="btn" type="submit" class="btn" style="width:100%;margin-top:16px">إرسال</button>
      </form>
      <p id="msg" style="display:none;margin-top:12px"></p>
    </div>
    <p style="text-align:center;font-size:14px;color:var(--muted);margin-top:18px">
      <a href="faq.html">الأسئلة الشائعة</a> · <a href="legal.html#privacy">الخصوصية</a> · <a href="legal.html#terms">الشروط</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="i18n-dict.js?v=1"></script>
  <script src="i18n.js?v=1"></script>
  <script src="app.js?v=10"></script>
  <script>
    const $ = id => document.getElementById(id);

    (async () => {
      const s = await getSession();
      if (s && s.user && s.user.email) $('email').value = s.user.email;
    })();

    $('form').onsubmit = async ev => {
      ev.preventDefault();

      // حقل وهمي لصيد الروبوتات: نتظاهر بالنجاح دون حفظ
      if ($('website').value) { $('form').reset(); showMsg('msg', 'وصلتنا رسالتك ✓ شكراً لتواصلك.', 'ok'); return; }

      let last = 0;
      try { last = Number(localStorage.getItem('last_contact')) || 0; } catch (_) {}
      if (Date.now() - last < 60000) { showMsg('msg', 'انتظر دقيقة قبل إرسال رسالة أخرى.', 'error'); return; }

      const btn = $('btn'); btn.disabled = true;
      const row = {
        name: $('name').value.trim(),
        email: $('email').value.trim(),
        subject: $('subject').value,
        message: $('text').value.trim()
      };
      const { error } = await sb.from('contact_messages').insert(row);
      btn.disabled = false;
      if (error) { showMsg('msg', 'تعذّر الإرسال، تحقق من البيانات (الرسالة 10 أحرف على الأقل) وحاول مرة أخرى.', 'error'); return; }

      try { localStorage.setItem('last_contact', String(Date.now())); } catch (_) {}
      $('text').value = '';
      showMsg('msg', 'وصلتنا رسالتك ✓ شكراً لتواصلك.', 'ok');
    };
  </script>
</body>
</html>
