<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاهتمامات - موقع سنة الحياة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fdfcf0;
      font-family: 'Cairo', sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }

    .nav-pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .nav-pills a {
      text-decoration: none;
      color: #004d40;
      border: 1px solid #004d40;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .nav-pills a:hover, .nav-pills a.active {
      background-color: #004d40;
      color: #fff;
    }

    .interests-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .interests-header {
      font-size: 1.4rem;
      color: #004d40;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .interest-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .tag {
      background: #f9f9f6;
      border: 1px solid #004d40;
      color: #004d40;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tag:hover, .tag.selected {
      background-color: #004d40;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل (الأزرار) -->
  <nav class="nav-pills">
    <a href="index.html">الرئيسية</a>
    <a href="browse.html">التصفح</a>
    <a href="interests.html" class="active">الاهتمامات</a>
    <a href="messages.html">المحادثات</a>
    <a href="profile.html">ملفي</a>
    <a href="admin.html">الإدارة</a>
  </nav>

  <!-- محتوى الاهتمامات -->
  <div class="interests-container">
    <div class="interests-header">تحديد الاهتمامات والأنشطة</div>
    <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.95rem;">اختر اهتماماتك لتخصيص محتوى المنصة بما يناسبك:</p>

    <div class="interest-tags">
      <span class="tag selected">توثيق الحسابات</span>
      <span class="tag">حماية الخصوصية</span>
      <span class="tag selected">التواصل الاجتماعي</span>
      <span class="tag">إدارة الملفات</span>
      <span class="tag">الأمان الرقمي</span>
      <span class="tag">الإشعارات والتنبيهات</span>
    </div>
  </div>

</body>
</html>
