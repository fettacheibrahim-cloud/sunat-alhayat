<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - المحادثات</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .conv{display:block;width:100%;text-align:start;padding:14px;margin:8px 0;background:#f7f5ee;border:1px solid #e5dcc5;border-radius:14px;font:inherit;cursor:pointer}
    #box{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:#f7f5ee;border-radius:14px;margin:10px 0}
    .b{max-width:80%;padding:8px 12px;border-radius:14px;word-wrap:break-word;white-space:pre-wrap}
    .b.me{align-self:flex-start;background:#0E3B3C;color:#fff}
    .b.other{align-self:flex-end;background:#fff;border:1px solid #e5dcc5}
    #send{display:flex;gap:8px}
    #text{flex:1;padding:10px;border:1px solid #cfc7b0;border-radius:10px;font:inherit}
  </style>
</head>
<body>
  <main class="card" style="max-width:600px;margin:30px auto;padding:20px">
    <div id="listView">
      <h1>المحادثات</h1>
      <p id="info" style="color:#666"></p>
      <div id="list"></div>
    </div>

    <div id="chatView" style="display:none">
      <button id="back" class="btn" style="background:#fff;color:#0E3B3C;border:1px solid #0E3B3C">→ رجوع</button>
      <h2 id="who" style="margin:12px 0 0"></h2>
      <div id="box"></div>
      <form id="send">
        <input id="text" placeholder="اكتب رسالة..." autocomplete="off" required>
        <button class="btn" type="submit">إرسال</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let me = null, cur = null, timer = null, lastCount = -1;

    async function loadList() {
      const { data: convs, error } = await sb.from('conversations')
        .select('id,user_a,user_b')
        .or('user_a.eq.' + me + ',user_b.eq.' + me);
      if (error) { $('info').textContent = 'خطأ: ' + error.message; return; }
      if (!convs.length) {
        $('info').textContent = 'لا توجد محادثات بعد. تُفتح المحادثة عندما يقبل أحد الطرفين اهتمام الآخر.';
        return;
      }
      const ids = convs.map(c => c.user_a === me ? c.user_b : c.user_a);
      const { data: ps } = await sb.from('profiles').select('id,first_name').in('id', ids);
      const names = {};
      (ps || []).forEach(p => names[p.id] = p.first_name);
      $('list').innerHTML = '';
      convs.forEach(c => {
        const other = c.user_a === me ? c.user_b : c.user_a;
        const b = document.createElement('button');
        b.className = 'conv';
        b.textContent = '💬 ' + (names[other] || 'عضو');
        b.onclick = () => openChat(c.id, names[other] || 'عضو');
        $('list').appendChild(b);
      });
    }

    async function loadMsgs() {
      if (!cur) return;
      const { data, error } = await sb.from('messages').select('*')
        .eq('conversation_id', cur).order('created_at');
      if (error || data.length === lastCount) return;
      lastCount = data.length;
      const box = $('box');
      box.innerHTML = '';
      data.forEach(m => {
        const d = document.createElement('div');
        d.className = 'b ' + (m.sender_id === me ? 'me' : 'other');
        d.textContent = m.body;
        box.appendChild(d);
      });
      box.scrollTop = box.scrollHeight;
    }

    function openChat(id, name) {
      cur = id; lastCount = -1;
      $('who').textContent = name;
      $('listView').style.display = 'none';
      $('chatView').style.display = 'block';
      loadMsgs();
      timer = setInterval(loadMsgs, 4000);
    }

    $('back').onclick = () => {
      clearInterval(timer); cur = null;
      $('chatView').style.display = 'none';
      $('listView').style.display = 'block';
    };

    $('send').onsubmit = async e => {
      e.preventDefault();
      const body = $('text').value.trim();
      if (!body) return;
      $('text').value = '';
      const { error } = await sb.from('messages')
        .insert({ conversation_id: cur, sender_id: me, body });
      if (error) { alert('تعذّر الإرسال: ' + error.message); $('text').value = body; return; }
      lastCount = -1;
      loadMsgs();
    };

    (async () => {
      const session = await getSession();
      if (!session) { location.href = 'auth.html'; return; }
      me = session.user.id;
      loadList();
    })();
  </script>
</body>
</html>
