<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحادثات - موقع سنة الحياة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fdfcf0;
      font-family: 'Cairo', sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }

    .nav-pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .nav-pills a {
      text-decoration: none;
      color: #004d40;
      border: 1px solid #004d40;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .nav-pills a:hover, .nav-pills a.active {
      background-color: #004d40;
      color: #fff;
    }

    .messages-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .messages-header {
      font-size: 1.4rem;
      color: #004d40;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .message-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      gap: 15px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
      border-radius: 8px;
    }

    .message-item:hover {
      background-color: #f9f9f6;
    }

    .msg-avatar {
      width: 50px;
      height: 50px;
      background-color: #e0f2f1;
      color: #004d40;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .msg-info {
      flex-grow: 1;
    }

    .msg-name {
      font-weight: bold;
      color: #004d40;
      margin-bottom: 3px;
    }

    .msg-text {
      font-size: 0.85rem;
      color: #666;
    }

    .msg-time {
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل (الأزرار) -->
  <nav class="nav-pills">
    <a href="index.html">الرئيسية</a>
    <a href="browse.html">التصفح</a>
    <a href="interests.html">الاهتمامات</a>
    <a href="messages.html" class="active">المحادثات</a>
    <a href="profile.html">ملفي</a>
    <a href="admin.html">الإدارة</a>
  </nav>

  <!-- محتوى المحادثات -->
  <div class="messages-container">
    <div class="messages-header">المحادثات والرسائل</div>

    <div class="message-item">
      <div class="msg-avatar">أ</div>
      <div class="msg-info">
        <div class="msg-name">أحمد</div>
        <div class="msg-text">أهلاً بك، هل تم التحقق من البيانات المطلوبة؟</div>
      </div>
      <div class="msg-time">منذ 5 د</div>
    </div>

    <div class="message-item">
      <div class="msg-avatar">م</div>
      <div class="msg-info">
        <div class="msg-name">محمد</div>
        <div class="msg-text">شكراً لتواصلك، تم تحديث الملف الشخصي بنجاح.</div>
      </div>
      <div class="msg-time">منذ ساعة</div>
    </div>
  </div>

</body>
</html>
