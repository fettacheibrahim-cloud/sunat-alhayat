<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - ملفي</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .f label{display:block;margin:12px 0 4px;font-weight:700}
    .f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid #cfc7b0;border-radius:10px;font:inherit;background:#fff;box-sizing:border-box}
    .st{display:inline-block;padding:4px 14px;border-radius:999px;font-size:14px;background:#eee}
    .st.approved{background:#dff3e3;color:#1f6b33}
    .st.pending{background:#fff1cc;color:#8a6200}
    .st.suspended{background:#fbdcdc;color:#9b1c1c}
    #msg{padding:10px;border-radius:10px}
    #msg.ok{background:#dff3e3;color:#1f6b33}
    #msg.error{background:#fbdcdc;color:#9b1c1c}
  </style>
</head>
<body>
  <main class="card" style="max-width:600px;margin:30px auto;padding:24px">
    <h1>ملفي الشخصي</h1>
    <p id="email" style="color:#666"></p>
    <p>حالة الحساب: <span id="st" class="st">...</span></p>
    <p id="msg" style="display:none;margin:10px 0"></p>

    <form id="form" class="f">
      <label>الاسم الأول</label>
      <input id="first_name" required>

      <label>الجنس</label>
      <select id="gender" required>
        <option value="">اختر</option>
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
      </select>

      <label>تاريخ الميلاد (18 سنة فأكثر)</label>
      <input id="birth_date" type="date" required>

      <label>البلد</label>
      <input id="country">

      <label>المدينة</label>
      <input id="city">

      <label>الحالة الاجتماعية</label>
      <select id="marital_status">
        <option value="">اختر</option>
        <option value="never_married">أعزب / عزباء</option>
        <option value="divorced">مطلّق / مطلّقة</option>
        <option value="widowed">أرمل / أرملة</option>
      </select>

      <label>المستوى الدراسي</label>
      <select id="education">
        <option value="">اختر</option>
        <option value="secondary">ثانوي</option>
        <option value="diploma">دبلوم</option>
        <option value="bachelor">إجازة / بكالوريوس</option>
        <option value="postgraduate">دراسات عليا</option>
      </select>

      <label>نبذة عني</label>
      <textarea id="bio" rows="4"></textarea>

      <label>ما الذي أبحث عنه</label>
      <textarea id="looking_for" rows="3"></textarea>

      <button id="save" type="submit" class="btn" style="width:100%;margin-top:18px">حفظ</button>
    </form>

    <button id="out" class="btn" style="width:100%;margin-top:12px;background:#fff;color:#0E3B3C;border:1px solid #0E3B3C">تسجيل الخروج</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const fields = ['first_name','gender','birth_date','country','city','marital_status','education','bio','looking_for'];
    const stAr = { pending:'قيد المراجعة', approved:'مقبول', suspended:'موقوف' };
    let uid = null, exists = false;

    function msg(text, type) {
      const el = $('msg');
      el.textContent = text;
      el.className = type;
      el.style.display = 'block';
    }

    function setStatus(s) {
      $('st').textContent = stAr[s] || 'لم يُنشأ بعد';
      $('st').className = 'st ' + (s || '');
    }

    function isAdult(d) {
      const b = new Date(d), t = new Date();
      let age = t.getFullYear() - b.getFullYear();
      const m = t.getMonth() - b.getMonth();
      if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
      return age >= 18;
    }

    (async () => {
      const session = await getSession();
      if (!session) { location.href = 'auth.html'; return; }
      uid = session.user.id;
      $('email').textContent = session.user.email;

      const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
      if (error) { msg('خطأ: ' + error.message, 'error'); return; }
      if (data) {
        exists = true;
        fields.forEach(k => { if (data[k] != null) $(k).value = data[k]; });
        setStatus(data.status);
      } else {
        setStatus(null);
      }
    })();

    $('form').onsubmit = async e => {
      e.preventDefault();
      if (!isAdult($('birth_date').value)) {
        msg('يجب أن يكون عمرك 18 سنة فأكثر', 'error');
        return;
      }
      const btn = $('save'); btn.disabled = true;
      const row = {};
      fields.forEach(k => { row[k] = $(k).value.trim() || null; });
      let res;
      if (exists) {
        res = await sb.from('profiles').update(row).eq('id', uid);
      } else {
        row.id = uid; row.status = 'pending';
        res = await sb.from('profiles').insert(row);
      }
      btn.disabled = false;
      if (res.error) { msg('خطأ: ' + res.error.message, 'error'); return; }
      if (!exists) { exists = true; setStatus('pending'); }
      msg('تم الحفظ ✓', 'ok');
    };

    $('out').onclick = logout;
  </script>
</body>
</html>
