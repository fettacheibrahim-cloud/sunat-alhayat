<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سنة الحياة - ملفي</title>
  <link rel="stylesheet" href="style.css?v=10">
  <style>
    .f label{display:block;margin:12px 0 4px;font-weight:700}
    .st{display:inline-block;padding:4px 14px;border-radius:999px;font-size:14px;background:#eee}
    .st.approved{background:#dff3e3;color:#1f6b33}
    .st.pending{background:#fff1cc;color:#8a6200}
    .st.suspended{background:#fbdcdc;color:#9b1c1c}
    .ph{display:flex;align-items:center;gap:16px;margin:14px 0;padding:14px;background:var(--sand);border-radius:16px}
    #img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--green);color:var(--gold2);display:flex;align-items:center;justify-content:center;font:700 38px 'Amiri',serif;flex:none;overflow:hidden}
    #img img{width:100%;height:100%;object-fit:cover}
    .chk{display:flex;align-items:center;gap:10px;margin-top:12px}
    .chk input{width:auto}
    .sm{padding:6px 16px;min-height:38px;font-size:14px}
    .opt{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px;margin:0 0 6px 6px}
    .opt input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
  </style>
</head>
<body>
  <main class="card" style="max-width:600px;margin:20px auto;padding:22px">
    <h1>ملفي الشخصي</h1>
    <p id="email" style="color:var(--muted)"></p>
    <p>حالة الحساب: <span id="st" class="st">...</span></p>
    <p id="msg" style="display:none"></p>

    <div class="ph">
      <div id="img">؟</div>
      <div>
        <label class="opt">🖼 المعرض<input id="fGallery" type="file" accept="image/*"></label>
        <label class="opt">📁 الملفات<input id="fFiles" type="file"></label>
        <label class="opt">📸 الكاميرا<input id="fCam" type="file" accept="image/*" capture="user"></label>
        <button id="delPhoto" class="btn ghost sm" type="button" style="display:none">حذف</button>
        <p id="phNote" style="font-size:13px;color:var(--muted);margin:6px 0 0"></p>
      </div>
    </div>
    <div class="chk">
      <input id="photo_visible_to_matches" type="checkbox">
      <label for="photo_visible_to_matches" style="margin:0;font-weight:500">أظهر صورتي للطرف الآخر بعد قبول الاهتمام</label>
    </div>

    <form id="form" class="f">
      <label>الاسم الأول</label><input id="first_name" required>
      <label>الجنس</label>
      <select id="gender" required><option value="">اختر</option><option value="male">ذكر</option><option value="female">أنثى</option></select>
      <label>تاريخ الميلاد (18 سنة فأكثر)</label><input id="birth_date" type="date" required>
      <label>البلد</label><input id="country" list="countries" autocomplete="off"><datalist id="countries"><option value="المغرب"><option value="الجزائر"><option value="تونس"><option value="ليبيا"><option value="مصر"><option value="موريتانيا"><option value="السودان"><option value="السعودية"><option value="الإمارات"><option value="قطر"><option value="الكويت"><option value="البحرين"><option value="عُمان"><option value="اليمن"><option value="العراق"><option value="سوريا"><option value="الأردن"><option value="فلسطين"><option value="لبنان"><option value="تركيا"><option value="فرنسا"><option value="إسبانيا"><option value="إيطاليا"><option value="بلجيكا"><option value="هولندا"><option value="ألمانيا"><option value="بريطانيا"><option value="سويسرا"><option value="السويد"><option value="البرتغال"><option value="أمريكا"><option value="كندا"><option value="أستراليا"></datalist>
      <label>المدينة</label><input id="city">
      <label>الحالة الاجتماعية</label>
      <select id="marital_status"><option value="">اختر</option><option value="never_married">أعزب / عزباء</option><option value="divorced">مطلّق / مطلّقة</option><option value="widowed">أرمل / أرملة</option></select>
      <label>المستوى الدراسي</label>
      <select id="education"><option value="">اختر</option><option value="secondary">ثانوي</option><option value="diploma">دبلوم</option><option value="bachelor">إجازة / بكالوريوس</option><option value="postgraduate">دراسات عليا</option></select>
      <label>المهنة</label><input id="occupation" maxlength="60" placeholder="مثال: معلّم، مهندسة، طالب…">
      <label>الطول (سم)</label><input id="height_cm" type="number" inputmode="numeric" min="120" max="230" placeholder="مثال: 175">

      <h3 style="margin-top:22px">القيم ونمط الحياة</h3>
      <p style="margin:0;color:var(--muted);font-size:14px">اختيارية، لكنها ترفع دقة نسبة التوافق وتساعد الطرف الآخر على معرفتك.</p>
      <label>درجة الالتزام</label>
      <select id="religiosity"><option value="">اختر</option><option value="practicing">ملتزم/ة</option><option value="moderate">متوسّط الالتزام</option><option value="learning">في طريق الالتزام</option></select>
      <label>المحافظة على الصلاة</label>
      <select id="prayer"><option value="">اختر</option><option value="always">أحافظ عليها</option><option value="mostly">غالباً</option><option value="sometimes">أحياناً</option><option value="rarely">نادراً</option></select>
      <label>التدخين</label>
      <select id="smoking"><option value="">اختر</option><option value="no">لا أدخّن</option><option value="quit">أقلعت عنه</option><option value="yes">أدخّن</option></select>
      <label>الرغبة في الأطفال</label>
      <select id="wants_children"><option value="">اختر</option><option value="yes">نعم</option><option value="open">منفتح/ة على الأمر</option><option value="no">لا</option></select>

      <h3 style="margin-top:22px">عنّي</h3>
      <label>نبذة عني</label><textarea id="bio" rows="4"></textarea>
      <label>ما الذي أبحث عنه</label><textarea id="looking_for" rows="3"></textarea>
      <button id="save" type="submit" class="btn" style="width:100%;margin-top:18px">حفظ</button>
    </form>
    <button id="out" class="btn ghost" style="width:100%;margin-top:12px">تسجيل الخروج</button>
    <button id="delAcc" class="btn ghost" style="width:100%;margin-top:12px;color:var(--err);border-color:var(--err)">حذف حسابي نهائياً</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="i18n-dict.js?v=1"></script>
  <script src="i18n.js?v=1"></script>
  <script src="app.js?v=10"></script>
  <script>
    const $ = id => document.getElementById(id);
    const fields = ['first_name','gender','birth_date','country','city','marital_status','education','occupation','height_cm','religiosity','prayer','smoking','wants_children','bio','looking_for'];
    const stAr = { pending:'قيد المراجعة', approved:'مقبول', suspended:'موقوف' };
    let uid = null, exists = false, photoPath = null;

    function msg(t, type) { const e = $('msg'); e.textContent = t; e.className = 'msg ' + type; e.style.display = 'block'; window.scrollTo(0, 0); }
    function setStatus(s) { $('st').textContent = stAr[s] || 'لم يُنشأ بعد'; $('st').className = 'st ' + (s || ''); }
    function isAdult(d) {
      const b = new Date(d), t = new Date();
      let a = t.getFullYear() - b.getFullYear();
      if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
      return a >= 18;
    }

    async function showPhoto() {
      const box = $('img'); box.innerHTML = '';
      if (!photoPath) { box.textContent = ($('first_name').value || '؟').charAt(0).toUpperCase(); $('delPhoto').style.display = 'none'; return; }
      const { data, error } = await sb.storage.from('photos').createSignedUrl(photoPath, 3600);
      if (error) {
        box.textContent = '!';
        $('phNote').textContent = 'تعذّر تحميل الصورة: ' + error.message;
        $('delPhoto').style.display = 'inline-block';
        return;
      }
      const i = document.createElement('img');
      i.onerror = () => { box.textContent = '!'; $('phNote').textContent = 'الصورة مرفوعة لكن تعذّر عرضها، تحقق من سياسات التخزين.'; };
      i.src = data.signedUrl + (data.signedUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
      box.appendChild(i);
      $('delPhoto').style.display = 'inline-block';
    }

    function enablePhoto() {
      $('phNote').textContent = exists ? 'صورة واضحة لوجهك، يتم تصغيرها تلقائياً.' : 'احفظ ملفك أولاً ثم أضف الصورة.';
    }

    function resize(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, 800 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob(b => b ? resolve(b) : reject(new Error('تعذّر تصغير الصورة')), 'image/jpeg', 0.85);
        };
        img.onerror = () => reject(new Error('تعذّر قراءة الصورة، جرّب صورة JPG أو PNG'));
        img.src = url;
      });
    }

    const PICKERS = ['fGallery', 'fFiles', 'fCam'];
    let pickedAt = 0, afterT = null, busy = false;

    async function uploadPhoto(f) {
      pickedAt = 0;
      if (busy) return;
      if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name || '')) { msg('اختر ملف صورة (JPG أو PNG).', 'error'); return; }
      busy = true;
      try {
        msg('جاري رفع الصورة...', 'ok');
        const blob = await resize(f);
        const path = uid + '/avatar.jpg';
        const up = await sb.storage.from('photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
        if (up.error) throw new Error('التخزين: ' + up.error.message);
        const r = await sb.from('profiles').update({ photo_path: path }).eq('id', uid);
        if (r.error) throw new Error('الملف: ' + r.error.message);
        photoPath = path; await showPhoto(); msg('تم رفع الصورة ✓', 'ok');
      } catch (err) {
        msg('تعذّر رفع الصورة: ' + (err && err.message ? err.message : err), 'error');
      }
      busy = false;
    }

    function takeFrom(input) {
      const f = input.files && input.files[0];
      if (!f) return false;
      input.value = '';
      uploadPhoto(f);
      return true;
    }
    function recheck() { return PICKERS.some(id => takeFrom($(id))); }

    PICKERS.forEach(id => {
      const el = $(id);
      ['change', 'input'].forEach(ev => el.addEventListener(ev, () => takeFrom(el)));
      el.addEventListener('click', e => {
        if (!exists) { e.preventDefault(); msg('احفظ ملفك الشخصي أولاً (زر حفظ في الأسفل) ثم أضف الصورة', 'error'); return; }
        pickedAt = Date.now();
      });
    });

    // بعض المتصفحات لا تطلق حدث الاختيار؛ نفحص الحقول عند العودة من نافذة الاختيار
    function afterPicker() {
      if (!pickedAt || afterT) return;
      setTimeout(recheck, 400);
      afterT = setTimeout(() => {
        afterT = null;
        recheck();
        if (pickedAt) {
          pickedAt = 0;
          $('phNote').textContent = 'لم تصل أي صورة من المتصفح. جرّب «الملفات» أو «الكاميرا»، أو افتح الموقع في متصفح آخر.';
        }
      }, 2500);
    }
    window.addEventListener('focus', afterPicker);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) afterPicker(); });

    $('delPhoto').onclick = async () => {
      if (!confirm('حذف الصورة؟')) return;
      await sb.storage.from('photos').remove([photoPath]);
      await sb.from('profiles').update({ photo_path: null }).eq('id', uid);
      photoPath = null; showPhoto(); msg('تم حذف الصورة', 'ok');
    };

    $('photo_visible_to_matches').onchange = async e => {
      if (!exists) return;
      const r = await sb.from('profiles').update({ photo_visible_to_matches: e.target.checked }).eq('id', uid);
      if (r.error) msg('خطأ: ' + r.error.message, 'error'); else msg('تم تحديث خيار الصورة ✓', 'ok');
    };

    (async () => {
      const s = await getSession();
      if (!s) { location.href = 'auth.html'; return; }
      uid = s.user.id; $('email').textContent = s.user.email;
      const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
      if (error) { msg('خطأ: ' + error.message, 'error'); return; }
      if (data) {
        exists = true;
        fields.forEach(k => { if (data[k] != null) $(k).value = data[k]; });
        $('photo_visible_to_matches').checked = !!data.photo_visible_to_matches;
        photoPath = data.photo_path; setStatus(data.status);
      } else setStatus(null);
      enablePhoto(); showPhoto();
    })();

    $('form').onsubmit = async e => {
      e.preventDefault();
      if (!isAdult($('birth_date').value)) { msg('يجب أن يكون عمرك 18 سنة فأكثر', 'error'); return; }
      const btn = $('save'); btn.disabled = true;
      const row = {}; fields.forEach(k => { row[k] = $(k).value.trim() || null; });
      if (row.height_cm != null) row.height_cm = parseInt(row.height_cm, 10) || null;
      row.photo_visible_to_matches = $('photo_visible_to_matches').checked;
      let res;
      if (exists) res = await sb.from('profiles').update(row).eq('id', uid);
      else { row.id = uid; row.status = 'pending'; res = await sb.from('profiles').insert(row); }
      btn.disabled = false;
      if (res.error) { msg('خطأ: ' + res.error.message, 'error'); return; }
      if (!exists) { exists = true; enablePhoto(); }
      const st = await sb.from('profiles').select('status').eq('id', uid).maybeSingle();
      const status = st.data ? st.data.status : 'pending';
      setStatus(status);
      if (status === 'approved') msg('تم الحفظ ✓ — حسابك مقبول، يمكنك الآن تصفّح الأعضاء.', 'ok');
      else if (status === 'pending') msg('تم الحفظ ✓ — ملفك قيد المراجعة اليدوية. للقبول الفوري: أكمل كل الحقول، واكتب نبذة (30 حرفاً فأكثر) دون أرقام هاتف أو روابط أو حسابات تواصل.', 'ok');
      else msg('تم الحفظ ✓', 'ok');
    };

    $('out').onclick = logout;

    $('delAcc').onclick = async () => {
      if (!confirm('سيتم حذف حسابك وملفك ومحادثاتك وصورتك نهائياً ولا يمكن التراجع. هل أنت متأكد؟')) return;
      const word = (prompt('للتأكيد اكتب كلمة: حذف') || '').trim().toLowerCase();
      if (!['حذف', 'supprimer', 'delete'].includes(word)) { msg('لم يتم الحذف.', 'error'); return; }
      $('delAcc').disabled = true;
      try {
        if (photoPath) await sb.storage.from('photos').remove([photoPath]);
        // حذف صور ورسائل المحادثة الصوتية التي أرسلها العضو (إن كانت ميزة الوسائط مفعّلة)
        try {
          const { data: mm } = await sb.from('messages').select('media_path')
            .eq('sender_id', uid).not('media_path', 'is', null);
          const paths = (mm || []).map(x => x.media_path).filter(Boolean);
          for (let i = 0; i < paths.length; i += 100) {
            await sb.storage.from('chat-media').remove(paths.slice(i, i + 100));
          }
        } catch (e) { /* لا نوقف الحذف بسبب هذه الخطوة */ }
        const { error } = await sb.rpc('delete_my_account');
        if (error) throw error;
        await sb.auth.signOut();
        alert('تم حذف حسابك. نتمنى لك التوفيق.');
        location.href = 'index.html';
      } catch (err) {
        $('delAcc').disabled = false;
        msg('تعذّر حذف الحساب: ' + (err && err.message ? err.message : err), 'error');
      }
    };
  </script>
</body>
</html>
