<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - موقع سنة الحياة</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fdfcf0; /* الخلفية الكريمية الهادئة */
      font-family: 'Cairo', sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }

    /* شريط التنقل العلوي الموحد */
    .nav-pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .nav-pills a {
      text-decoration: none;
      color: #004d40;
      border: 1px solid #004d40;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .nav-pills a:hover, .nav-pills a.active {
      background-color: #004d40;
      color: #fff;
    }

    /* حاوية الملف الشخصي */
    .profile-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      background-color: #e0f2f1;
      color: #004d40;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 auto 15px auto;
      border: 2px solid #004d40;
    }

    .profile-header h2 {
      margin: 0 0 5px 0;
      color: #004d40;
      font-size: 1.6rem;
    }

    .profile-header p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
    }

    /* معلومات الحساب */
    .info-group {
      margin-bottom: 15px;
      padding: 12px 15px;
      background: #f9f9f6;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      font-weight: 600;
      color: #555;
    }

    .info-value {
      color: #2c3e50;
    }

    .btn-edit {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #004d40;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
      transition: background 0.3s;
    }

    .btn-edit:hover {
      background-color: #00695c;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل (الأزرار) -->
  <nav class="nav-pills">
    <a href="index.html">الرئيسية</a>
    <a href="browse.html">التصفح</a>
    <a href="interests.html">الاهتمامات</a>
    <a href="messages.html">المحادثات</a>
    <a href="profile.html" class="active">ملفي</a>
    <a href="admin.html">الإدارة</a>
  </nav>

  <!-- محتوى الملف الشخصي -->
  <div class="profile-container">
    <div class="profile-header">
      <div class="profile-avatar">إ</div>
      <h2>إبراهيم</h2>
      <p>حساب موثق - سنة الحياة</p>
    </div>

    <div class="info-group">
      <span class="info-label">البريد الإلكتروني</span>
      <span class="info-value">brahim@example.com</span>
    </div>

    <div class="info-group">
      <span class="info-label">حالة الحساب</span>
      <span class="info-value" style="color: #2e7d32; font-weight: bold;">نشط وموثق</span>
    </div>

    <div class="info-group">
      <span class="info-label">الخصوصية</span>
      <span class="info-value">تحكم كامل في عرض الصور والمعلومات</span>
    </div>

    <a href="#" class="btn-edit">تعديل الملف الشخصي</a>
  </div>

</body>
</html>
